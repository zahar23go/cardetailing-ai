<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0D10" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CAR DETAILING AI" />
    <title>CAR DETAILING AI</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />
    <link rel="icon" type="image/png" href="/icons/icon-192x192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Manrope:wght@400;500;600;700;800&family=Montserrat:wght@400;700&display=swap" rel="stylesheet" />
    <style>
      #pwa-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #0B0D10;
        color: #F0D9A0;
        font-family: Manrope, system-ui, sans-serif;
        transition: opacity 0.35s ease;
      }
      #pwa-splash.is-hidden {
        opacity: 0;
        pointer-events: none;
      }
      #pwa-splash img {
        width: 120px;
        height: auto;
        margin-bottom: 18px;
      }
      #pwa-splash .pwa-splash-title {
        font-family: Cinzel, Georgia, serif;
        letter-spacing: 0.14em;
        font-size: 13px;
        font-weight: 700;
        background: linear-gradient(180deg, #f0d9a0 0%, #d4a84b 50%, #a67c2d 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
    </style>
  </head>
  <body>
    <div id="pwa-splash">
      <img src="/images/logo-formula-sport.png" alt="" />
      <div class="pwa-splash-title">CAR DETAILING AI</div>
    </div>
    <div id="root"></div>
    <script>
      (function () {
        var local = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
        if (!local || !('serviceWorker' in navigator)) return;
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          regs.forEach(function (r) { r.unregister(); });
        });
        if (window.caches) {
          caches.keys().then(function (keys) {
            keys.forEach(function (k) { caches.delete(k); });
          });
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
